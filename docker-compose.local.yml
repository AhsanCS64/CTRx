# Optional isolated PostgreSQL; no host database port.
services:
  db:
    image: postgres:18.1-bookworm
    environment:
      POSTGRES_USER: ctrx
      POSTGRES_DB: ctrx
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.docker}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ctrx -d ctrx"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
  backend:
    depends_on:
      db:
        condition: service_healthy
  migrate:
    depends_on:
      db:
        condition: service_healthy
volumes:
  pgdata:
