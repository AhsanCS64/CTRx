[tool.poetry]
name = "ctrx"
version = "0.1.0"
description = "Central Tenant Records (CTR) backend"
authors = ["H. M. Ahsan Habib <ahsan@example.com>"]
license = "MIT"

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.115.0"
uvicorn = {extras = ["standard"], version = "^0.30.0"}
sqlalchemy = {version = "^2.0.35", extras = ["postgresql"]}
psycopg = {version = "^3.2.3", extras = ["binary"]}
python-multipart = "^0.0.9"
argon2-cffi = "^23.1.0"
cryptography = "^43.0.1"
python-jose = {version = "^3.3.0", extras = ["cryptography"]}
pydantic-settings = "^2.5.2"
segno = "^1.6.1"
reportlab = "^4.2.5"
weasyprint = "^62.3"
# Test dependencies
pytest = "^8.3.2"
httpx = "^0.27.2"

[tool.poetry.dev-dependencies]
# optional dev tools
ruff = "^0.6.2"
mypy = "^1.13.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
select = ["E","F","I","UP","B"]

[tool.mypy]
ignore_missing_imports = true
python_version = "3.12"
